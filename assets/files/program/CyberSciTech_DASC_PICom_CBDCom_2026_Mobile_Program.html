<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Program of IEEE CyberSciTech, DASC, PICom and CBDCom 2026, 9 to 13 November 2026, RMIT University, Melbourne.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>CyberSciTech / DASC / PICom / CBDCom 2026 Program</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a pocket timetable. Teal masthead, a sticky day strip, time blocks with sticky headers, session cards in each
   conference's tint that open to their talks, and a tab bar at the bottom (Program, Keynotes, My program, Info). */
:root {
  --bg: #f1f5f6; --surface: #ffffff; --ink: #17252a; --muted: #53656b; --faint: #7f9298; --line: #d8e2e5;
  --teal: #1f4e5a; --bar-ink: #ffffff; --bar-sub: #cfe1e6; --bar-chip: rgba(255, 255, 255, .1); --bar-chip-on: #ffffff;
  --bar-chip-on-ink: #1f4e5a; --accent: #1f5f6e; --plen: #3b6874; --plen-ink: #ffffff; --plen-sub: #d7e8ec;
  --brk: #e8eef0; --brk-ink: #586a70; --red: #c0141c; --red-bg: #cf1124; --on-red: #ffffff; --star: #c98a00;
  --focus: #2a86a8; --mark: #ffe28a; --mark-ink: #17252a;
  --cst: #1d4f8c; --cst-t: #e4eef9; --dasc: #2c6b2c; --dasc-t: #e5f2df; --pic: #a35a12; --pic-t: #fcebdc;
  --cbd: #573c80; --cbd-t: #eee8f7; --tut: #1f6e66; --tut-t: #ddf1ee; --g9: #383838; --g9-t: #e3e3e3;
  --g9-chip: #4a4a4a; --pan-t: #3b6874;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --barH: 58px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d171a; --surface: #14232a; --ink: #e3ecef; --muted: #a2b5bb; --faint: #7c9197; --line: #24373e;
    --teal: #15363e; --bar-ink: #ffffff; --bar-sub: #b9d2d8; --bar-chip: rgba(255, 255, 255, .08); --bar-chip-on: #e3f1f4;
    --bar-chip-on-ink: #15363e; --accent: #8cc8d6; --plen: #29505a; --plen-ink: #ffffff; --plen-sub: #c4dce2;
    --brk: #18282e; --brk-ink: #9db1b7; --red: #ff7d74; --red-bg: #c41a2c; --on-red: #ffffff; --star: #f1c04a;
    --focus: #6fc4df; --mark: #6a5714; --mark-ink: #fff5cf;
    --cst: #93bbf0; --cst-t: #172739; --dasc: #98d293; --dasc-t: #172a1a; --pic: #f0b47d; --pic-t: #32231a;
    --cbd: #c6b0f0; --cbd-t: #241c33; --tut: #86d4c9; --tut-t: #132f2c; --g9: #d6d6d6; --g9-t: #272b2c;
    --g9-chip: #5d6466; --pan-t: #29505a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d171a; --surface: #14232a; --ink: #e3ecef; --muted: #a2b5bb; --faint: #7c9197; --line: #24373e;
  --teal: #15363e; --bar-ink: #ffffff; --bar-sub: #b9d2d8; --bar-chip: rgba(255, 255, 255, .08); --bar-chip-on: #e3f1f4;
  --bar-chip-on-ink: #15363e; --accent: #8cc8d6; --plen: #29505a; --plen-ink: #ffffff; --plen-sub: #c4dce2;
  --brk: #18282e; --brk-ink: #9db1b7; --red: #ff7d74; --red-bg: #c41a2c; --on-red: #ffffff; --star: #f1c04a;
  --focus: #6fc4df; --mark: #6a5714; --mark-ink: #fff5cf;
  --cst: #93bbf0; --cst-t: #172739; --dasc: #98d293; --dasc-t: #172a1a; --pic: #f0b47d; --pic-t: #32231a;
  --cbd: #c6b0f0; --cbd-t: #241c33; --tut: #86d4c9; --tut-t: #132f2c; --g9: #d6d6d6; --g9-t: #272b2c;
  --g9-chip: #5d6466; --pan-t: #29505a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.42; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--teal); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.tnum { font-variant-numeric: tabular-nums; }

/* masthead and day strip */
.mast { background: var(--teal); color: var(--bar-ink); }
.mast .wrap { padding-block: 14px 8px; }
.mast h1 { margin: 0; font-size: 17px; font-weight: 800; line-height: 1.25; letter-spacing: -.01em; text-wrap: balance; }
.mast p { margin: 4px 0 0; font-size: 12.5px; color: var(--bar-sub); }
.days { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--teal); }
.days .wrap { padding-block: 6px 10px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.day { border: 0; border-radius: 10px; background: var(--bar-chip); color: var(--bar-ink); padding: 6px 0 5px; cursor: pointer; display: grid; justify-items: center; gap: 0; position: relative; }
.day .dw { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; opacity: .85; }
.day .dn { font-size: 18px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.day[aria-current="true"] { background: var(--bar-chip-on); color: var(--bar-chip-on-ink); }
.day[aria-current="true"] .dw { opacity: 1; }
.day .today { position: absolute; top: 5px; right: 7px; width: 6px; height: 6px; border-radius: 50%; background: var(--red-bg); }
.days.searching .day { opacity: .55; }
.days.searching .day[aria-current="true"] { background: var(--bar-chip); color: var(--bar-ink); }

/* search and filters */
.tools { display: grid; gap: 10px; padding-block: 14px 4px; }
.search { position: relative; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--faint); pointer-events: none; }
.search input { width: 100%; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 0 40px 0 38px; font: inherit; font-size: 16px; }
.search input::placeholder { color: var(--faint); }
.search .clear { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border: 0; background: transparent; color: var(--muted); border-radius: 50%; cursor: pointer; display: grid; place-items: center; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip svg { width: 15px; height: 15px; }
.chip[aria-pressed="true"] { background: var(--ct, var(--accent)); border-color: var(--ct, var(--accent)); color: var(--surface); }
.chip.cst { --ct: var(--cst); } .chip.dasc { --ct: var(--dasc); } .chip.pic { --ct: var(--pic); } .chip.cbd { --ct: var(--cbd); }
.chip .k { color: var(--ct, var(--accent)); }
.chip[aria-pressed="true"] .k { color: inherit; }

/* day content */
main { padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
.dayhead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-block: 14px 4px; }
.dayhead h2 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -.01em; }
.dayhead p { margin: 2px 0 0; color: var(--muted); font-size: 13px; text-wrap: pretty; }
.linkbtn { border: 0; background: transparent; color: var(--accent); font-weight: 700; font-size: 13px; padding: 6px 0; cursor: pointer; white-space: nowrap; }
.items { display: grid; gap: 8px; padding-block: 8px 12px; }
.line { display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 10px; align-items: start; padding: 9px 12px; border-radius: 10px; color: inherit; text-decoration: none; }
.line .lt { font-weight: 700; font-size: 13.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.line .lt small, .loc { display: block; font-weight: 500; font-size: 11.5px; opacity: .8; white-space: nowrap; }
.line .lb { min-width: 0; }
.line .lh { font-weight: 700; }
.line .l2 { display: block; font-style: italic; color: var(--plen-sub); margin-top: 2px; font-size: 13.5px; }
.line.plenary { background: var(--plen); color: var(--plen-ink); }
.line.plenary .tag.on { background: var(--surface); }
.line.break { background: var(--brk); color: var(--brk-ink); font-style: italic; padding-block: 7px; }
.line.event, .line.social { background: var(--surface); border: 1px solid var(--line); }
.line.event .lb b, .line.social .lb b { color: var(--accent); }
a.line .go { display: inline-block; margin-left: 4px; opacity: .85; font-style: normal; }
.slot { display: grid; gap: 8px; }
.slot-h { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--barH)); z-index: 10; background: var(--bg); display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; padding-block: 12px 6px; border-bottom: 1px solid var(--line); }
.slot-h .st { font-weight: 800; font-size: 15px; color: var(--accent); font-variant-numeric: tabular-nums; }
.slot-h .sl { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.slot-h .loc { display: inline; font-size: 12px; color: var(--muted); }
.cards { display: grid; gap: 10px; }
.hidden-note { margin: 0; font-size: 12.5px; color: var(--faint); }

/* session cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; scroll-margin-top: calc(var(--barH) + 60px); }
.card-h { background: var(--tint); padding: 10px 6px 10px 12px; display: grid; gap: 4px; }
.cst { --c: var(--cst); --tint: var(--cst-t); } .dasc { --c: var(--dasc); --tint: var(--dasc-t); }
.pic { --c: var(--pic); --tint: var(--pic-t); } .cbd { --c: var(--cbd); --tint: var(--cbd-t); }
.tut { --c: var(--tut); --tint: var(--tut-t); } .g912 { --c: var(--g9); --tint: var(--g9-t); }
.pan { --c: var(--plen-ink); --tint: var(--pan-t); }
.card.pan .card-h { color: var(--plen-ink); }
.card.pan .meta, .card.pan .ty { color: var(--plen-sub); }
.row1 { display: flex; align-items: flex-start; gap: 4px; }
.badges { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-height: 40px; }
.code { font-weight: 800; font-size: 17px; color: var(--c); letter-spacing: -.01em; }
.ty { font-size: 11.5px; font-weight: 700; color: var(--muted); border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 1px 6px; }
.card.pan .ty { background: transparent; border-color: var(--plen-sub); }
.sp { flex: 1; }
.stitle { margin: 0; font-size: 15.5px; font-weight: 700; line-height: 1.3; padding-right: 6px; text-wrap: pretty; }
.meta { font-size: 13px; color: var(--muted); padding-right: 6px; }
.meta .when { color: var(--red); font-weight: 700; font-variant-numeric: tabular-nums; }
.card.pan .meta .when { color: var(--plen-ink); }
.meta .dot { margin: 0 5px; opacity: .6; }
.meta .rm { white-space: nowrap; }
.meta .lvl { font-size: 12px; opacity: .85; }
.meta .tba { font-style: italic; }
.meta .loc { display: inline; font-size: 12.5px; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 5px; padding: 1px 6px; line-height: 1.45; font-style: normal; white-space: nowrap; }
.tag.onl { background: var(--red-bg); color: var(--on-red); }
.tag.hyb { border: 1px solid var(--faint); color: var(--muted); background: var(--surface); }
.tag.on { border: 1px solid var(--red); color: var(--red); background: var(--surface); }
.tag.wip { border: 1px solid var(--line); color: var(--muted); background: var(--brk); }
.tag.l9 { background: var(--g9-chip); color: var(--on-red); }
.now { display: inline-block; background: var(--red-bg); color: var(--on-red); font-size: 11px; font-weight: 800; border-radius: 999px; padding: 1px 8px; letter-spacing: .03em; font-style: normal; }
.is-now { box-shadow: 0 0 0 2px var(--red-bg); }
.star { width: 40px; height: 40px; border: 0; background: transparent; color: var(--faint); border-radius: 50%; display: grid; place-items: center; cursor: pointer; flex: 0 0 auto; }
.star svg { width: 21px; height: 21px; }
.star[aria-pressed="true"] { color: var(--star); }
.star[aria-pressed="true"] svg path { fill: currentColor; }
.card.pan .star { color: var(--plen-sub); }
.more { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 0; border-top: 1px solid var(--line); background: var(--surface); color: var(--accent); font-weight: 700; font-size: 13.5px; padding: 11px 12px; cursor: pointer; text-align: left; }
.more svg { width: 18px; height: 18px; transition: transform .18s ease; }
.more[aria-expanded="true"] svg { transform: rotate(180deg); }
.talks { border-top: 1px solid var(--line); }
.talk { display: grid; grid-template-columns: 52px minmax(0, 1fr) 40px; gap: 8px; padding: 10px 2px 10px 12px; scroll-margin-top: calc(var(--barH) + 60px); }
.talk + .talk { border-top: 1px solid var(--line); }
.talk .tm { font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--ink); padding-top: 1px; }
.talk .tm small { display: block; font-weight: 500; color: var(--faint); font-size: 12px; }
.talk .tm .loc { color: var(--accent); font-size: 11.5px; opacity: 1; margin-top: 3px; }
.talk .tb { min-width: 0; }
.talk .tt { font-weight: 600; font-size: 14.5px; line-height: 1.32; text-wrap: pretty; }
.talk .au { color: var(--muted); font-size: 13px; margin-top: 3px; }
.talk .tmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 5px; font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
.talk.is-now { box-shadow: inset 3px 0 0 var(--red-bg); background: var(--tint); }
.flash { animation: flash 1.6s ease-out 1; }
@keyframes flash { 0% { box-shadow: 0 0 0 3px var(--focus); } 100% { box-shadow: 0 0 0 3px transparent; } }
.panel-link { width: 100%; border: 0; border-top: 1px solid var(--line); background: var(--surface); color: var(--accent); font-weight: 700; font-size: 13.5px; padding: 11px 12px; text-align: left; cursor: pointer; }

/* search results and my program */
.count { margin: 12px 0 2px; color: var(--muted); font-size: 13px; }
.group { display: grid; gap: 6px; padding-block: 10px 4px; }
.group h3 { margin: 6px 0 2px; font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.res { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.res-main { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; width: 100%; text-align: left; background: transparent; border: 0; border-radius: 10px; padding: 10px 4px 10px 10px; cursor: pointer; color: inherit; }
.codechip { font-weight: 800; font-size: 12.5px; color: var(--c, var(--accent)); background: var(--tint, var(--brk)); border-radius: 6px; padding: 2px 6px; white-space: nowrap; }
.res .rm { min-width: 0; display: grid; gap: 2px; }
.res .rt { font-weight: 600; font-size: 14px; line-height: 1.3; }
.res .ra { color: var(--muted); font-size: 12.5px; }
.res .rw { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
.res .star { margin: 2px 2px 0 0; }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
mark { background: var(--mark); color: var(--mark-ink); border-radius: 3px; padding: 0 1px; }
.empty { text-align: center; padding: 40px 12px; color: var(--muted); display: grid; justify-items: center; gap: 10px; }
.empty svg { width: 40px; height: 40px; color: var(--faint); }
.empty h2 { margin: 0; color: var(--ink); font-size: 18px; }
.empty p { margin: 0; max-width: 34ch; }
.btn { border: 0; background: var(--accent); color: var(--surface); font-weight: 700; border-radius: 10px; padding: 10px 16px; cursor: pointer; }

/* keynotes, panels and info */
.vhead { padding-block: 18px 6px; }
.vhead h2 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
.vhead p { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; }
.stack { display: grid; gap: 10px; padding-block: 6px 10px; }
.kn { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 4px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; scroll-margin-top: 16px; }
.kn img, .kn .ph { width: 84px; height: 105px; border-radius: 8px; object-fit: cover; background: var(--brk); }
.kn .ph { display: grid; place-items: center; color: var(--faint); font-weight: 800; letter-spacing: .08em; font-size: 13px; }
.kn .kb { min-width: 0; display: grid; gap: 3px; align-content: start; }
.nw { white-space: nowrap; }
.kwhen { margin: 0; font-size: 12.5px; color: var(--red); font-weight: 700; font-variant-numeric: tabular-nums; }
.kconf { margin: 0; font-size: 12px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.kn h3, .pn h3 { margin: 0; font-size: 16px; font-weight: 700; line-height: 1.3; text-wrap: balance; }
.kname { margin: 0; font-size: 13.5px; color: var(--muted); }
.kname b { color: var(--ink); }
.kn details { grid-column: 1 / -1; margin-top: 8px; border-top: 1px solid var(--line); padding-top: 8px; }
.kn summary { cursor: pointer; color: var(--accent); font-weight: 700; font-size: 13.5px; padding: 4px 0; }
.kn details h4 { margin: 10px 0 4px; font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.kn details p, .pn p { margin: 0 0 8px; font-size: 14px; line-height: 1.5; max-width: 68ch; }
.pn { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 4px; scroll-margin-top: 16px; }
.pn .pq { font-style: italic; color: var(--muted); }
.info { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 8px; }
.info h3 { margin: 0; font-size: 15px; font-weight: 800; }
.info p { margin: 0; font-size: 14px; max-width: 68ch; }
.info dl { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 12px; font-size: 14px; }
.info dt { font-weight: 700; font-variant-numeric: tabular-nums; }
.info dd { margin: 0; min-width: 0; }
.info dd .lvl { display: block; font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.legend { display: grid; gap: 7px; font-size: 14px; }
.legend div { display: flex; gap: 8px; align-items: baseline; }
.legend .tag, .legend .rc { flex: 0 0 auto; }

/* tab bar and now button */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 35; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar .wrap { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding-block: 4px 4px; }
.tab { border: 0; background: transparent; color: var(--faint); display: grid; justify-items: center; gap: 2px; padding: 6px 0; font-size: 11px; font-weight: 700; cursor: pointer; position: relative; }
.tab svg { width: 23px; height: 23px; }
.tab[aria-current="page"] { color: var(--accent); }
.tab .badge { position: absolute; top: 2px; left: calc(50% + 6px); min-width: 17px; height: 17px; border-radius: 9px; background: var(--star); color: var(--surface); font-size: 10.5px; line-height: 17px; padding: 0 4px; font-variant-numeric: tabular-nums; }
.nowbtn { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(74px + env(safe-area-inset-bottom, 0px)); z-index: 34; border: 0; background: var(--red-bg); color: var(--on-red); font-weight: 800; border-radius: 999px; padding: 10px 16px; box-shadow: 0 4px 14px rgba(0, 0, 0, .18); cursor: pointer; }
@media (min-width: 700px) {
  .mast h1 { font-size: 20px; }
  .line { grid-template-columns: 96px minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  .flash { animation: none; }
  .more svg { transition: none; }
}

3:30","h":"","p":[["Lunch · Level 10",""]],"tags":[]},{"k":"line","kind":"social","t":"13:30–15:30","h":"","p":[["Visit RMIT AIDA Hub and Campus Tour","b"]],"tags":[]},{"k":"line","kind":"break","t":"15:30–16:00","h":"","p":[["Afternoon Tea · Level 10",""]],"tags":[]},{"k":"line","kind":"event","t":"16:00–17:00","h":"","p":[["Committee Meeting","b"]],"tags":[]}]}],"keynotes":[{"tba":false,"when":"Tuesday 10 November · 09:40–10:20","room":"080.01.002","conf":"PICom","online":false,"name":"Dr Branko Ristic","affiliation":"RMIT University","title":"Machine reasoning under epistemic uncertainty: Bayesian inference and graphical models using imprecise probabilities","abstract":["Machines are increasingly asked to reason over large volumes of uncertain, heterogeneous information: sensor measurements, natural-language reports such as “possible warship,” and expert domain knowledge. Much of this uncertainty is epistemic, arising from lack of knowledge rather than randomness. Standard Bayesian inference handles it by forcing imprecise knowledge into precise probabilities, and as a result it can be confidently wrong. This talk argues for integrity in machine reasoning: a model should represent exactly the knowledge available, no more and no less. We introduce imprecise probabilities, where belief is represented by credal sets (closed convex sets of probability distributions). This framework includes belief functions, possibility theory, and random sets as special cases. We show how Walley’s generalised Bayes rule can be computed in practice using bisection and bilinear programming. We then lift it to large models through credal valuation networks, a valuation algebra that supports local computation. Examples range from classification with an imprecise confusion matrix to ongoing threat assessment onboard an underwater vehicle. In these examples, the resulting probability bounds always contain the ground truth and are tighter than those of evidential networks. We close with the computational cost and open problems."],"bio":["Branko Ristic received the Ph.D. degree from Queensland University of Technology in 1995. After research and engineering positions in the former Yugoslavia and in Australia, he joined the Defence Science and Technology Organisation (now Defence Science and Technology Group, DSTG) in 1996. In 2003–04 he spent a year of study leave at IRIDIA, Université libre de Bruxelles, Belgium. Since 2015 he has been a Principal Research Fellow in the School of Engineering at RMIT University, where he has led some 20 research projects, mainly funded by DSTG. He is co-author of two books, Beyond the Kalman Filter: Particle Filters for Tracking Applications (Artech House, 2004) and Particle Filters for Random Set Models (Springer, 2013), as well as over 120 journal articles and 10 book chapters. His research interests include information fusion, Bayesian estimation, target tracking, Monte Carlo methods, search techniques, sensor control, and machine reasoning under uncertainty."],"photo":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQgJh0gISD/2wBDAQUGBggHCA8ICA8gFRIVICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICD/wgARCADIAKADASIAAhEBAxEB/8QAGwAAAQUBAQAAAAAAAAAAAAAAAAECAwQFBgf/xAAZAQACAwEAAAAAAAAAAAAAAAAAAQIDBAX/2gAMAwEAAhADEAAAAfUhCIogCgAo2MJo6zE76VrMoyMkamqqDBRoAFCAAKIGuoDjoQ1c+i7UrRxssanJTTr7+3zetdn0RqyBUBKIoRAAAAzEvwZdcCzLm2VYb8MZUKl+snFtYWpsw7dzJ1NORwJJK6OREQAAAZLq8+DpPdG0nJE+IdGGWrnuhdBFbR0uxj7PQ5k7VJwSSOQIgEwGJ4sb+Pyb+pv+a9pC3Vy15lS1JMqOUNjOvxwNDq/O7WvL6ANdfkSSKUUQKpDHg8Whttx9DF1HpC3JiUhY+rvRuORX0K5CKCvq2PsHKm7kMlilaYBFigOhFNh4+jJVuoreQ0dSkp6smXJAjs59+VWP1+L2d1I1zdXPZLFKxoEWAoVcfosTNsyK3QwV7ebodU1WZ94o11x6uNYuo9ASOTbzUY9oo5Y5GNFIsAAhnRPGYzJzdDQp5WXC7Wo51xRTsWW+jzrWzhaNlFpFSqUcjHiQFjJFADNuYly5fouX6nJv5w07eLZl7d46XNhY6xvwJRntIdcrJVK66lZqnIBCQiQzjkN0svRHg++5vqOb04oLmNryUtaK70cFy3nT57G2I5ojkfCmrLEY78DoapORxZEp6EYZiW8anTaxXdLt umber of our recent work on machine unlearning as examples."],"bio":["Professor Wanlei Zhou is currently the Vice Rector (Academic Affairs), City University of Macau, Macao SAR, China. He received the B.Eng and M.Eng degrees from Harbin Institute of Technology, Harbin, China in 1982 and 1984, respectively, and the PhD degree from The Australian National University, Canberra, Australia, in 1991, all in Computer Science and Engineering. He also received a DSc degree (a higher Doctorate degree) from Deakin University in 2002. Before joining City University of Macau, Professor Zhou held various positions including the Head of School of Computer Science in University of Technology Sydney, Australia, the Alfred Deakin Professor, Chair of Information Technology, Associate Dean, and Head of School of Information Technology in Deakin University, Australia. Professor Zhou also served as a lecturer in University of Electronic Science and Technology of China, a system programmer in HP at Massachusetts, USA; a lecturer in Monash University, Melbourne, Australia; and a lecturer in National University of Singapore, Singapore. His main research interests include security, privacy, and distributed computing. Professor Zhou has published more than 500 papers in refereed international journals and refereed international conferences proceedings, including many articles in IEEE transactions and journals. Prof Zhou is an IEEE Life Fellow."],"photo":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQgJh0gISD/2wBDAQUGBggHCA8ICA8gFRIVICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICD/wgARCAEsAPADASIAAhEBAxEB/8QAHAAAAgMBAQEBAAAAAAAAAAAABAUCAwYBAAcI/8QAGQEAAwEBAQAAAAAAAAAAAAAAAQIDAAQF/9oADAMBAAIQAxAAAAHtDpLwcjKKoXC+QE9Q5cpuzFWLWqsKo3GQufFUG9gQXHrQxbhH7lzZxQGgjG0cuYUik2d5+2INMyh8oghohOrW3F88V5LCphBYEU5J6vLV1BBHOs2awDf2tjkH1NHnwRjjxVYAwVtOXgecs3YNymVSIlo2zKngy5xSt0SIrVbjFsu+oGvjjAh4uV/azKFJIDzBj ions. Frequent cases of various cyber threats have been encountered over the years and, hence, detection of anomalous behavior is a topic of great interest in cybersecurity. In described case studies, traffic traces collected by various collection sites are used to classify network anomalies. Various anomaly and intrusion detection approaches based on machine learning have been employed to analyze collected data. Deep learning, broad learning, gradient boosted decision trees, and reservoir computing algorithms were used to develop models based on collected datasets that contain Internet worms, viruses, power outages, ransomware events, router misconfigurations, Internet Protocol hijacks, and infrastructure failures in times of conflict. The reported results indicate that while performance of machine learning models greatly depends on the used datasets, they are viable tools for detecting the Internet anomalies."],"bio":["Ljiljana Trajkovic received the Dipl. Ing. degree from University of Pristina, Yugoslavia, the M.Sc. degrees in electrical engineering and computer engineering from Syracuse University, Syracuse, NY, and the Ph.D. degree in electrical engineering from University of California at Los Angeles. She is currently a professor in the School of Engineering Science, Simon Fraser University, Burnaby, British Columbia, Canada. Her research interests include communication networks and dynamical systems. Dr. Trajkovic served as IEEE Division X Delegate/Director, President of the IEEE Systems, Man, and Cybernetics Society, and President of the IEEE Circuits and Systems Society. She serves as Editor-in-Chief of the IEEE Transactions on Human-Machine Systems. She is a Distinguished Lecturer of the IEEE Systems, Man, and Cybernetics Society and was a Distinguished Lecturer of the IEEE Circuits and System Society. She is a Fellow of the IEEE."],"photo":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhIS rq5Xc09Glxhi03Fb0rFxMxLm3UAwOnb+CQJFVXnNiu9TN2FzywS4YtrVZ7QBwgOCPqXTSfiYULYwwsdDNcrB0zTo6iRI1RwCwty9jMW3JByb/s+ZvEUkRp4YXOmI9VmlcsLu3+G+huGGTk8kb3ADbkgaKHiCua1ETAs547S0mzkrXncUg7GooNRG4wG5eBSshYVWG6SsShcgLcVujhzRwcQ2dHhEuJsR0w1BYanE2T0Zx1IwgIcJZ6ZIqEDJbAOQQhAQqyPiVAxee+4QjAF9zTqKnnodHn//2Q=="},{"tba":false,"when":"Thursday 12 November · 09:40–10:20","room":"080.01.002","conf":"CBDCom","online":false,"name":"Dr Sahraoui Dhelim","affiliation":"Dublin City University","title":"Frontiers in Specialised AI: From Vision-Language Data Pipelines to DRL-Based Compiler Optimisation","abstract":["As artificial intelligence shifts from broad foundation models toward specialized engineering solutions, custom AI architectures are reshaping how we address domain-specific computational challenges. This keynote explores the power and adaptability of specialized machine learning paradigms across two distinct operational frontiers: automated multimodal dataset curation and low-level system optimization.","First, we examine the deployment of Vision-Language Models (VLMs) to unlock unstructured historical artifacts by automating the digitization, transcription, and semantic tagging of complex Arabic manuscripts. We demonstrate how VLMs handle intricate calligraphic styles, diacritics, and physical degradation to synthesize high-fidelity datasets at scale. Second, we pivot to systems engineering, illustrating how Deep Reinforcement Learning (DRL) navigates the massive search spaces inherent in compiler optimization, specifically phase ordering and instruction scheduling. DRL agents learn performance heuristics that consistently outpace traditional compiler passes.","By examining both domains through the lens of high-dimensional, irregular decision spaces, this talk presents actionable methodologies for designing resilient, domain-tailored AI pipelines across data-centric and compute-centric infrastructure."],"bio":["Dr. Sahraoui Dhelim is the research director of the School of Computing at Dublin City University. Previously, he was a senior researcher at University College Dublin from 2021 to 2024 and a Visiting Researcher at Ulster University from 2020 to 2021.","He earned his Ph.D. in Computer Science and Technology from the University of Science and Technology Beijing. He also holds a Master's degree in Networking and Distributed Systems from the University of Laghouat, and a Bachelor's degree in Computer Science from the University of Djelfa.","His scholarly contributions include over 110 peer-reviewed publications, complemented by editorial responsibilities at leading journals and conferences. He was a keynote speaker at the International Conference on Applied Artificial Intelligence and Emerging Technologies (AAIET 2025). He received the IEEE HITC Award for Excellence in Hyper-Intelligence (Technical Achievement)","His professional recognition includes Fellow HEA, he also earned the Universal Design in Teaching and Learning badge. Universal Design for Learning (UDL)."],"photo":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQgJh0gISD/2wBDAQUGBggHCA8ICA8gFRIVICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICD/wgARCAEsAPADASIAAhEBAxEB/8QAHAAAAQQDAQAAAAAAAAAAAAAAAAECBQYDBAcI/8QAGQEBAQEBAQEAAAAAAAAAAAAAAAEDAgUE/9oADAMBAAIQAxAAAAHsoAAAAAAAAACKgIoIADXIIACKlCKggAgBsAQAAAAAAAAAyIJlKPoS9HOSWqy4orQABFShFQQAEVDYAgAAAAAACtwPJYkK2jLcuMSNiVhks9JTflztq3YatgACKggAIqGwBAAAAABz60+epYyR3rH8300vJYtVIpJPcsqK2hxVMV2rvTt9o4D33fBRFsRAAAEVDYAgAAAAQ4bU51M9rZtZd3x/Wjs01k0yjNzYWzXw7uKdRURPaOffHvR/Beqex5F5A1zAAAEANgCAAAARUPPjtiCy36bvxEr43rSObTza55m4zuPwZTmx+pIxuffO7lXt31PL7MB9PzgAAAiobAEAAAAihwaqX2u573OYg5nyPVlc1O0dsugETKWOjo+kdc3rXo83LtV2116zqszSbv8Ab8gBt8wACKRnAAAAA1NvXl4pht8J5vr78DcGYd0yySj98oe1xcjjpBNkshD61iRdCJmNW2wWjU2/V8kA0xAAAjOAAAAAihTK/wBJo3n+ni34eU+f65AfDd5ZpCCluenaT9Oyw6ujsLETFf6BrjII5PS8pBQQAAIzgAAAAABDTKc9czS2VTy/W3hK7npY2Y5HXjSbtxtOfHy3z6aPSaPePS80A+v5AARF   /* ---------- small pieces ---------- */

  /* ---------- search ---------- */
  function norm(s) { return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }

    var h = esc(text);

  function renderDays() {
    $("#days-in").innerHTML = D.days.map(function (d, i) {
      return '<button class="day" type="button" data-day="' + i + '" aria-current="' + (i === S.day && !S.q.trim()) + '" aria-label="' + esc(d.long) + '"><span class="dw">' +
        esc(d.short) + '</span><span class="dn">' + esc(d.num) + "</span>" + (live() && d.date === aedtDate(NOW) ? '<span class="today" aria-hidden="true"></span>' : "") + "</button>";
    }).join("");
    $("#days").classList.toggle("searching", !!S.q.trim());
  }
  function updateBar() { var b = $("#days"); if (b && !b.hidden) document.documentElement.style.setProperty("--barH", b.offsetHeight + "px"); }
  function render() {
    VIEWS.forEach(function (v) { $("#v-" + v).hidden = S.view !== v; });
    $("#days").hidden = S.view !== "program";
    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (t) { t.setAttribute("aria-current", t.getAttribute("data-view") === S.view ? "page" : "false"); });
    var n = Object.keys(S.stars).length, b = $("#starCount");
    b.hidden = !n; b.textContent = n;
    if (S.view === "program") {
      renderDays(); renderChips();
      $("#clearQ").hidden = !S.q;
      $("#prog").innerHTML = S.q.trim() ? searchHTML() : dayHTML();
    } else if (S.view === "keynotes") $("#v-keynotes").innerHTML = keynotesHTML();
    else if (S.view === "my") $("#v-my").innerHTML = myHTML();
    else $("#v-info").innerHTML = infoHTML();
    var nowEl = S.view === "program" && !S.q.trim() && document.querySelector("#prog .is-now");
    $("#nowBtn").hidden = !nowEl;
    updateBar();
  }
  function scrollToEl(el, center) {
    if (!el) return;
    el.scrollIntoView({ block: center ? "center" : "start", behavior: reduceMotion ? "auto" : "smooth" });
    el.classList.add("flash");
    setTimeout(function () { el.classList.remove("flash"); }, 1700);
  }
  function setView(v) { S.view = v; render(); window.scrollTo(0, 0); }
  function goToSession(id, dom) {
    var ref = SESS[id];
    if (!ref) return;
    if (!passFilter(ref.s)) { S.conf = []; S.online = false; store.set("conf", []); store.set("online", false); }
    S.view = "program"; S.q = ""; $("#q").value = ""; S.day = ref.day; S.open[id] = true;
    store.set("day", S.day);
    render();
    requestAnimationFrame(function () { scrollToEl(document.getElementById(dom || "s-" + id), !!dom); });
  }
  function goToKeynote(sel) { S.view = "keynotes"; render(); requestAnimationFrame(function () { scrollToEl(document.querySelector(sel), false); }); }

  /* ---------- events ---------- */
  var qTimer = null;
  $("#q").addEventListener("input", function (e) {
    var v = e.target.value;
    clearTimeout(qTimer);
    qTimer = setTimeout(function () { S.q = v; render(); }, 120);
  });
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-star],[data-toggle],[data-day],[data-view],[data-goto],[data-kn],[data-panel],[data-conf],[data-online],[data-tz],#expandAll,#clearQ,#nowBtn");
    if (!el) return;
    if (el.hasAttribute("data-star")) {
      e.preventDefault(); e.stopPropagation();
      var k = el.getAttribute("data-star");
      if (S.stars[k]) delete S.stars[k]; else S.stars[k] = true;
      saveStars();
      var on = !!S.stars[k];
      Array.prototype.forEach.call(document.querySelectorAll('[data-star="' + k.replace(/"/g, '\\"') + '"]'), function (b) {
        b.setAttribute("aria-pressed", on);
        b.setAttribute("aria-label", (on ? "Remove " : "Star ") + b.getAttribute("aria-label").replace(/^(Remove|Star) /, ""));
      });
      var n = Object.keys(S.stars).length, b = $("#starCount"); b.hidden = !n; b.textContent = n;
      if (S.view === "my") render();
      return;
    }
    if (el.id === "clearQ") { $("#q").value = ""; S.q = ""; render(); $("#q").focus(); return; }
    if (el.id === "nowBtn") { scrollToEl(document.querySelector("#prog .is-now"), true); return; }
    if (el.id === "expandAll") {
      var open = el.getAttribute("data-open") !== "1";
      el.getAttribute("data-ids").split(" ").forEach(function (id) { if (open) S.open[id] = true; else delete S.open[id]; });
      render(); return;
    }
    if (el.hasAttribute("data-toggle")) {
      var id = el.getAttribute("data-toggle");
      if (S.open[id]) delete S.open[id]; else S.open[id] = true;
      var isOpen = !!S.open[id], list = document.getElementById("t-" + id);
      if (list) list.hidden = !isOpen;
      el.setAttribute("aria-expanded", isOpen);
      var n = SESS[id] ? SESS[id].s.talks.length : 0;
      el.firstChild.textContent = isOpen ? "Hide talks" : "Show " + plural(n, "talk");
      return;
    }
    if (el.hasAttribute("data-day")) {
      S.day = +el.getAttribute("data-day"); S.q = ""; $("#q").value = ""; store.set("day", S.day);
      render(); window.scrollTo(0, 0); return;
    }
    if (el.hasAttribute("data-view")) { setView(el.getAttribute("data-view")); return; }
    if (el.hasAttribute("data-kn")) { e.preventDefault(); goToKeynote("#kn-" + el.getAttribute("data-kn")); return; }
    if (el.hasAttribute("data-panel")) { e.preventDefault(); goToKeynote("#pn-" + el.getAttribute("data-panel")); return; }
    if (el.hasAttribute("data-goto")) { goToSession(el.getAttribute("data-goto"), el.getAttribute("data-dom")); return; }
    if (el.hasAttribute("data-conf")) {
      var c = el.getAttribute("data-conf"), i = S.conf.indexOf(c);
      if (i >= 0) S.conf.splice(i, 1); else S.conf.push(c);
      store.set("conf", S.conf); render(); return;
    }
    if (el.hasAttribute("data-online")) { S.online = !S.online; store.set("online", S.online); render(); return; }
    if (el.hasAttribute("data-tz")) { S.tz = !S.tz; store.set("tz", S.tz); render(); return; }
  });
  window.addEventListener("resize", updateBar);
  function fromHash() {
    var h = decodeURIComponent((location.hash || "").slice(1));
    if (!h) return false;
    var up = h.toUpperCase();
    for (var id in SESS) { if (id.toUpperCase() === up || SESS[id].s.code.toUpperCase().replace(/\s+/g, "-") === up) { goToSession(id); return true; } }
    var v = { program: "program", keynotes: "keynotes", panels: "keynotes", my: "my", info: "info" }[h.toLowerCase()];
    if (v) { S.view = v; render(); if (h.toLowerCase() === "panels") requestAnimationFrame(function () { scrollToEl($("#panels"), false); }); return true; }
    var di = D.days.map(function (d) { return d.short.toLowerCase(); }).indexOf(h.toLowerCase());
    if (di >= 0) { S.day = di; render(); return true; }
    return false;
  }
  window.addEventListener("hashchange", fromHash);
  if (!fromHash()) render();
  if (live()) setInterval(function () { NOW = nowMs(); if (S.view === "program" && !S.q.trim()) render(); }, 120000);
})();
</script>

</body>
</html>
